[package]
name = "nodus-sync-server"
description = "Self-hosted sync server for Nodus: stores versioned, content-addressed blobs and metadata only. It cannot decrypt vault content by construction because there is no key on this side, encrypted or otherwise."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "nodus-sync-server"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rand = "0.8"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
nodus-telegram = { path = "../telegram" }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
hmac = "0.12"
sha2 = "0.10"
