[package]
name = "nodus-crypto"
description = "End-to-end encryption for Nodus sync: password/recovery-phrase key derivation, content encryption, and deterministic filename hiding. No filesystem or vault concerns. This is purely a crypto toolkit the sync layer calls into."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
bip39 = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
