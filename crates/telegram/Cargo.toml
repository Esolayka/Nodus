[package]
name = "nodus-telegram"
description = "Telegram integration: verifying Mini App initData signatures and a small Bot API client for the companion bot."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
