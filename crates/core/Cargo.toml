[package]
name = "nodus-core"
description = "Nodus vault logic: files, frontmatter, watcher, and the Git/server sync backends. No GUI."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
notify = "8"
notify-debouncer-full = "0.5"
trash = "5"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
git2 = { version = "0.21", features = ["vendored-libgit2", "vendored-openssl", "ssh"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
hex = "0.4"
nodus-crypto = { path = "../crypto" }
nodus-telegram = { path = "../telegram" }
rand = "0.8"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
encoding_rs = "0.8"
chardetng = "0.1"
csv = "1"

[dev-dependencies]
tempfile = "3"
nodus-sync-server = { path = "../sync-server" }
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
hmac = "0.12"
