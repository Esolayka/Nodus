[package]
name = "nodus-ai"
description = "AI assistant: user-supplied provider connections (OpenAI-compatible, Anthropic, Ollama), key storage, and context handling. No bundled keys, no Nodus-run servers."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
thiserror = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
rusqlite = { version = "0.32", features = ["bundled"] }
fastembed = "4"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
